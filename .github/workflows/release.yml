name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
          dotnet-quality: preview

      - name: Publish
        run: dotnet publish -c Release

      - name: Install WiX
        run: dotnet tool install --global wix

      - name: Build MSI
        run: wix build installer/WorkTimer.wxs -d "PublishDir=bin/Release/net10.0-windows/win-x64/publish" -o bin/Release/WorkTimer.msi

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: bin/Release/WorkTimer.msi
          generate_release_notes: true
